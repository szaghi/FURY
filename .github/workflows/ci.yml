name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # a release tag points at a commit already tested on its branch push
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    - name: Fetch dependencies
      if: hashFiles('**/.deps_config.ini') != ''
      run: fobis fetch

    - name: Run tests with coverage
      id: cov
      uses: ./.github/actions/run-coverage-analysis

    - name: Run tests without quadruple precision
      run: |
        fobis rule --ex delexe
        fobis build --mode tests-gnu-noquad
        bash scripts/run_tests.sh

  docs-examples:
    # the programs of docs/examples are built and run, and their snippets and outputs regenerated:
    # the committed ones, included by the documentation, must match what the code produces
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    - name: Fetch dependencies
      run: fobis fetch

    - name: Build and run the examples
      run: FC=gfortran bash scripts/docs_examples.sh

    - name: Check the committed snippets and outputs
      run: |
        git add --intent-to-add docs/examples
        git diff --exit-code -- docs/examples || {
          echo "::error::docs/examples is out of date: run 'bash scripts/docs_examples.sh' and commit the result"
          exit 1
        }
